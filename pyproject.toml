[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceagent"
version = "0.12.0"
description = "KDE-friendly desktop voice assistant"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["desktop", "kde", "speech", "stt", "tts", "voice"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "PySide6>=6.10,<6.12",
  "sounddevice>=0.5,<0.6",
  "faster-whisper>=1.2,<2",
  "huggingface_hub>=0.34,<2",
  "piper-tts>=1.4,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-qt>=4",
]
dev = [
  "pytest>=8",
  "pytest-qt>=4",
  "ruff>=0.5",
]
# Chatterbox TTS engine — Resemble AI's zero-shot voice cloning model
# (`ResembleAI/chatterbox-turbo-ONNX`). Pure ONNX runtime path, no
# PyTorch dep. `huggingface_hub` is already a base dep so it isn't
# listed here.
chatterbox = [
  "onnxruntime>=1.20",
  "transformers>=4.40",
  "librosa>=0.10",
  "soundfile>=0.12",
]

[project.scripts]
voiceagent = "voiceagent.__main__:main"

[project.urls]
Repository = "https://github.com/pizzimenti/voiceagent"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voiceagent = ["qml/*.qml", "qml/engines/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

# Ruff is a development convenience (CodeRabbit references its rule
# codes in PR reviews — RUF012, FBT001, BLE001, etc.). The vendor tree
# carries third-party code we do not own; excluding it keeps
# `ruff check .` focused on first-party sources. Rule selection stays
# at Ruff's default for now.
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/vendor"]

[tool.ruff.lint.per-file-ignores]
# Test files legitimately set `QT_QPA_PLATFORM` before importing
# PySide6 — the import order is load-bearing, not a style issue.
# Lambda assignments inside test fixtures are concise stubs (status
# hooks, fake protocol implementations); rewriting them as `def` adds
# noise without value.
"tests/**" = ["E402", "E731"]
